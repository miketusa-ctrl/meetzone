# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "meetzone-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
VERSION = "0.2.0"
MCP_REGISTRY_AUTH = ""

[observability]
enabled = true
head_sampling_rate = 1

[limits]
cpu_ms = 100

[[kv_namespaces]]
binding = "MEETZONE_KV"
id = "<KV_NAMESPACE_ID>"

[[unsafe.bindings]]
name = "MCP_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 10, period = 60 }
